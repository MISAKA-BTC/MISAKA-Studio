name: Release

# Builds the thing a non-developer can actually run.
#
# The README's quick start asks for Rust, Node, Git and a C++ toolchain, then fifteen minutes of
# compiling — which is the right instruction for someone working ON the Studio and the wrong one
# for someone who wants to USE it. A Windows user following it hits three "not recognised" errors
# before the first line of the build. None of that is needed to run a compiled binary, so this
# compiles it once, here, on the platform it is for.
#
# Why a workflow and not a checked-in binary: this repository's own CI is the only Windows machine
# it has. A release built anywhere else is a claim; one built here is reproducible from a tag, and
# the toolchain versions are the ones the CI already tests against.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under (e.g. v0.1.0). Leave empty for a draft with no tag.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            # NSIS is the one that produces a double-clickable .exe; the MSI is for managed
            # deployments and comes from the same build.
            bundles: nsis,msi
          - os: macos-latest
            label: macOS bundle
            bundles: dmg
          - os: ubuntu-latest
            label: Linux bundle
            bundles: deb,appimage
    steps:
      - name: Fix CRLF
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '22'

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # The bundle has to carry the runtime: that is what makes the installed app self-contained —
      # no PATH, no second download, no Rust on the user's machine. Note where it ends up. This
      # copies into the desktop crate's `resources/`, and tauri keeps that directory name inside
      # the bundle, so the sidecar sits one level DOWN from the executable (and in
      # `Contents/Resources/resources/` on macOS) — NOT beside it, which is what this comment used
      # to claim and what `locate_runtime_binary` used to assume. v0.1.0 shipped the file in every
      # installer with no way to reach it.
      - name: Build the runtime
        run: cargo build --release --bin misaka-studiod

      # The runtime compiles `ui/dist` into itself, so "Build the UI" must come first — and if it
      # ever stops doing so, the binary still builds, still runs, and serves the headless "no UI
      # bundle" page instead of the app. That is precisely the failure the packaged v0.1.x showed
      # its users, and nothing about the artifact looks wrong until a window opens on it. So the
      # order is asserted here rather than trusted: `--check` names the UI's source.
      - name: The bundled runtime must carry the UI
        shell: bash
        run: |
          BIN=target/release/misaka-studiod
          [ "${{ runner.os }}" = "Windows" ] && BIN=target/release/misaka-studiod.exe
          # The embedded line specifically: on this machine `ui/dist` exists, so the line that
          # says what THIS process serves would read "(directory)" and hide an empty embed.
          UI=$("$BIN" --check | grep '^ui (embedded)' || true)
          echo "$UI"
          case "$UI" in
            *files*) ;;
            *) echo "::error::the release runtime has no UI compiled in — 'Build the UI' must run before 'Build the runtime'"; exit 1 ;;
          esac

      - name: Stage the runtime as a bundle resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/misaka-studiod.exe desktop/src-tauri/resources/
          else
            cp target/release/misaka-studiod desktop/src-tauri/resources/
          fi
          ls -l desktop/src-tauri/resources

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # Invoked from `desktop/src-tauri` because that is where the config lives — but note that the
      # config's two kinds of path do NOT share a base, which is what broke the first release run
      # on all three platforms at once:
      #
      #   frontendDist        is relative to the config file      -> desktop/src-tauri/../../ui/dist
      #   beforeBuildCommand  runs in the app dir (desktop/)      -> desktop/../ui
      #
      # Written as `../../ui`, the before-command resolved to a `ui/` one level ABOVE the checkout
      # (`/Users/runner/work/MISAKA-Studio/ui`) and died on a package.json that was never there.
      # Moving the invocation around cannot fix that; tauri picks the app dir itself. The fix is in
      # the config, and this step stays where the CLI expects to be run.
      - name: Bundle
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          # Tauri's output layout differs per bundle type; take everything installable and let the
          # upload list what it found rather than asserting a path that moves between versions.
          find target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -l dist

      # A no-install path, Windows only: the two binaries the installer lays down, in the layout
      # the app looks for them in. macOS already has one — the .app inside the dmg is dragged
      # wherever the user likes — and Linux has the AppImage. Windows was the platform with no
      # answer for someone who cannot or will not run an installer that asks for admin.
      #
      # pwsh rather than bash: `Compress-Archive` and `ConvertFrom-Json` ship with the runner, so
      # this depends on nothing that has to be installed or found on PATH.
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = "dist/misaka-studio-$version-x64-portable"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          Copy-Item target/release/misaka-studio.exe "$stage/"
          Copy-Item desktop/src-tauri/resources/misaka-studiod.exe "$stage/resources/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: misaka-studio-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: bundle
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts

      # A DRAFT, deliberately. These installers are unsigned, so Windows SmartScreen will warn on
      # first run and macOS Gatekeeper will refuse without an explicit override — facts a release
      # note has to state before anyone downloads. Publishing is a human step that includes writing
      # that down.
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          body: |
            Unsigned builds. On first run:

            * **Windows** — SmartScreen shows "Windows protected your PC". Choose *More info* →
              *Run anyway*.
            * **macOS** — Gatekeeper refuses the app. Right-click it → *Open*, then confirm.

            **Windows without installing**: `misaka-studio-*-x64-portable.zip` is the same two
            binaries in a folder. Unzip it anywhere and run `misaka-studio.exe`; keep `resources/`
            beside it, which is where the app looks for its runtime. No admin, no installer.

            Chat needs an inference engine the Studio does not bundle: install llama.cpp so
            `llama-server` is on PATH. Mining does not need it.
