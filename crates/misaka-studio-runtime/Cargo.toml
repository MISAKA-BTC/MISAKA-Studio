[package]
name = "misaka-studio-runtime"
description = "MISAKA Runtime: swappable LLM backends behind an OpenAI-compatible API, with model management and provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "misaka-studiod"
# Builds the UI bundle into the binary; see build.rs and src/api/ui.rs.
build = "build.rs"

[[bin]]
name = "misaka-studiod"
path = "src/bin/misaka-studiod.rs"

[dependencies]
misaka-studio-core.workspace = true

anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# The coding agent's workspace API (src/workspace.rs): ripgrep's own walker, so .gitignore, .ignore
# and the global excludes mean what they mean to `rg` and `git`; its regex engine for search; and
# globset for the search's file filter.
ignore = "0.4"
regex = "1"
globset = "0.4"

# `exec` puts each command in its own session and kills the whole process group on a timeout —
# `setsid` and `killpg`, which std does not expose. Already in the lockfile through tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
