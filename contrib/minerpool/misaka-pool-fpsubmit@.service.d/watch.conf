[Service]
# 2026-09-11: the in-repo submitter (misaka-palw-fp-rail --watch, main 3c78e898) replaces
# /opt/misaka-minerpool/fp-autosubmit.py for every slot. It submits one claim at a time, checks
# each claim's own exposure against the bond's room BEFORE paying a fee (the script did not, and
# most of slot-06's carriers were mined and then dropped at the exposure ceiling), chains funding
# through each carrier's change, and confirms each carrier became a claim.
#   --rpc: the host's explorer node — a slot node runs no wRPC.
#   --coinbase-funding-only: so funding discovery can never reach for the SLOT panel's fee float,
#     which the explorer node's locked set does not contain (a float is carrier change, never coinbase).
#   --retention-dir: the SLOT node's own, which is the node that serves the claims' openings.
# The unit name is kept: pool.py reports `submitter_running` by it. Roll back by deleting this file,
# `systemctl daemon-reload`, and restarting misaka-pool-fpsubmit@NN.
ExecStart=
ExecStart=/root/t11/misaka-palw-fp-rail --watch /var/lib/misaka-minerpool/slots/slot-%i/fp/outbox --bond-key-seed /var/lib/misaka-minerpool/slots/slot-%i/seed.key --rpc 127.0.0.1:26313 --retention-dir /var/lib/misaka-minerpool/slots/slot-%i/appdir/misaka-testnet-11/palw-retention --coinbase-funding-only --interval 20
# The one-shot child reads the job's capture (≈150–180 MB for a 256–300-token answer) and writes the
# staged material beside it; 512M was the script's budget with a thinner child.
MemoryMax=1G
